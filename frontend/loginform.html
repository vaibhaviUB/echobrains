<!DOCTYPE html>
<html>
    <head>
        <title>Login Form</title>
    </head>
    <body>
        <form action="#" method="post" id="loginForm">
            Username: <input type="text" id="username" placeholder="Enter your username" required><br><br>
            Password: <input type="password" id="password" placeholder="Enter your password" required><br><br>
            Email: <input type="email" id="email" placeholder="Enter your email" required><br><br>       
            <input type="submit" value="Login">
            <input type="reset" value="Reset">
        </form>
    </body>
</html>
