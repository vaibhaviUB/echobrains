<html>
    <head>
        <style>
            li{
                /*element selector*/
                color: red;
                font-family: 'Courier New', Courier, monospace;
                font-weight: 400;
            }
            #para1{
                /*id selector*/
                color:blueviolet;
                border-color: black;
                border-width: 2px;
                border-style: solid; 
                padding: 10px;   
                border-style: dotted;
                border-radius: 10px;
            }
            .img1{
                /*class selector*/
                border-radius: 10px;
                border: 2px solid black;

            }
        </style>
    </head>
    <body>
        <p id="para1">style sheet evolution in www started from css and its improved to 
            framework for easy way to implement styles
        </p>
        <ol>
            <li>css</li>
            <li>bootstrap</li>
            <li>tailwind css</li>
        </ol>
        <ul>
            <li>css</li>
            <li>bootstrap</li>
            <li>tailwind css</li>
        </ul>
        <img src="https://www.w3schools.com/css/img_fjords.jpg" alt="fjords" width="300" height="200" class="img1">
    </body>
</html>
