<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
            text-align: center;
        }

        .profile {
            width: 500px;
            margin: 80px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
        }

        .profile img{
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }

        h1 {
            color: darkblue;
        }

        h3 {
            color: gray;
        }

        p {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="profile">
        <img src="pic.jpeg" alt="Profile Image">
        <h1>Vaibhavi Bhandare</h1>
        <h3>Student | Web Developer</h3>
        <h2>About Me</h2>
        <p> Hello! I am Vaibhavi. I am a passionate student interested
            in programming, web development and technology. I enjoy
            learning new skills and working on creative projects.
        </p>
    </div>
</body>
</html>
