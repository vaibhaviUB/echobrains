<!DOCTYPE html>
<html>
    <head>
        <style>
            .test{
                display:none;
            }
            .test2{
                display:inline;
            }
            .test3{
                display:block;
            }
            .box{
                width: 200px;
                height: 200px;
                margin: 10px;
                display:inline-block;
                text-align:center;
                
            }
            .container{
                display:flex;
                flex-direction:column;
            }

        </style>
    </head>
    <body>
        <h1>Products </h1>
        <div class ="container">
            <div class="box">laptop
                <img src="o.avif" alt="Laptop" style="width:100%">
            </div>
            <div class="box">iphone
                <img src="iphone.avif" alt="Iphone" style="width:100%">
        </div>
        <div class="box">headphones
            <img src="headphones.avif" alt="Headphones" style="width:100%">
        </div>
        </div>
        </body>
        <p class="test">This is a test paragraph.the display used to decide how to display an element.</p>
        <p> inline means the element will be displayed on the same line as the surrounding content.</p>
        <p class="test2">This is another paragraph with inline display.</p>
        <p class="test3">This is another paragraph with block display.</p>
        
    </body>
</html>
